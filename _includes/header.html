<section class="hero" aria-labelledby="hero-title">
  <div id="particles-js" aria-hidden="true"></div>
  <div class="hero-inner">
    <p class="eyebrow">Quality engineering · thoughtful technology · accessible experiences</p>
    <h1 id="hero-title">{{ site.username }}</h1>
    <p class="hero-summary">{{ site.user_title }}</p>
    <div class="hero-actions">
      <a class="button button-primary" href="#projects">Explore selected work</a>
      <a class="button button-secondary" href="{{ '/blog/' | relative_url }}">Read the blog</a>
    </div>
    <ul class="social-links" aria-label="Professional profiles">
      <li><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a></li>
      <li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>
    </ul>
  </div>
</section>
